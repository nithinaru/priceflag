[project]
name = "priceflag-ml"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "lightgbm==4.7.0",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "psycopg[binary]==3.3.4",
    "scikit-learn==1.9.0",
    "statsmodels==0.14.6",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
