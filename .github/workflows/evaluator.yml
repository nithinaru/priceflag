# Evaluator tick. Scheduled daily so staged rollouts can advance or pause; also
# runnable via workflow_dispatch after the target and credentials are verified.
#
# Beta still has auto-rollback OFF in the app. This schedule only evaluates
# (advance / pause / alert). Price writes on stage advance are intentional once
# a merchant has confirmed a rollout.
#
# Do not add this job to vercel.json crons. Deployment Protection 302s an
# unauthenticated request and Vercel Cron does not follow redirects.
#
# Deployment Protection stays on for previews: the URL is guessable, so an
# unprotected preview would let anyone write prices to a real Shopify store.
#
# Two secrets, doing two different jobs, and both are required:
#   VERCEL_AUTOMATION_BYPASS_SECRET — gets past Deployment Protection
#   CRON_SECRET                     — proves to the app that this is the evaluator
# The bypass alone reaches a 401. The bearer alone reaches a 302. Neither secret
# is sufficient on its own, which is the point.
#
name: evaluator

on:
  schedule:
    # 13:15 UTC daily — after US morning, not coinciding with ML nightly 07:00 UTC.
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Override the deployment URL (for testing a preview)'
        required: false
        default: ''

concurrency:
  # Never let two ticks overlap. Rollouts are leased in the database as well, so
  # this is belt and braces — but a queued pile-up after an outage helps nobody.
  group: evaluator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call the evaluator
        env:
          BASE_URL: ${{ github.event.inputs.base_url || vars.PRICEFLAG_URL || 'https://dashboard.priceflag.org' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET is not set. The evaluator cannot run, so no rollout will advance or roll back."
            exit 1
          fi
          # The bypass is only needed for a PROTECTED host. Vercel's protection
          # exempts a project's production domain, so dashboard.priceflag.org
          # needs no bypass — /api/cron/evaluate is authenticated by CRON_SECRET.
          # A preview URL still needs a bypass, hence optional-with-warning
          # rather than required.
          if [ -z "${BYPASS:-}" ]; then
            echo "::notice::No bypass secret set — expected when targeting the production domain."
          fi

          echo "Calling $BASE_URL/api/cron/evaluate"

          # -w writes the status on its own last line; -o keeps the body separate
          # so a protection redirect cannot be mistaken for a result.
          status=$(curl -sS -o /tmp/evaluator.json -w '%{http_code}' \
            --max-time 120 \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$BASE_URL/api/cron/evaluate" \
            -H "Authorization: Bearer $CRON_SECRET" \
            ${BYPASS:+-H "x-vercel-protection-bypass: $BYPASS"} \
            -H 'x-vercel-set-bypass-cookie: false' \
            -H 'content-type: application/json')

          echo "HTTP $status"
          cat /tmp/evaluator.json || true
          echo

          case "$status" in
            200|207)
              ;;
            302|307)
              echo "::error::Deployment Protection redirected the request. The bypass secret is missing, wrong, or was rotated."
              exit 1
              ;;
            401)
              echo "::error::The app rejected CRON_SECRET. The bypass worked, the bearer did not."
              exit 1
              ;;
            404)
              echo "::error::/api/cron/evaluate is not deployed at $BASE_URL."
              exit 1
              ;;
            *)
              echo "::error::Unexpected status $status from the evaluator."
              exit 1
              ;;
          esac

          # 207 means some rollouts errored. Surface it rather than passing green.
          if [ "$status" = "207" ]; then
            echo "::warning::Some rollouts failed to evaluate — see the errors array above."
          fi

          python3 - <<'PY'
          import json
          with open('/tmp/evaluator.json') as fh:
              data = json.load(fh)
          summary = ', '.join(f'{k}={v}' for k, v in data.items() if k != 'errors')
          print(f'::notice::evaluator {summary}')
          if data.get('caught_up'):
              print(f"::warning::caught up {data['caught_up']} day(s) the schedule had missed")
          PY
