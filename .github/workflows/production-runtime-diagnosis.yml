name: production-runtime-diagnosis

on:
  workflow_dispatch:

# This is deliberately a read-only, approval-gated diagnostic. It reads Vercel
# production variables only on the runner, proves whether Supabase accepts the
# configured service key, and prints no values, URLs, response bodies, or logs.
permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: priceflag-ml-production
    steps:
      - name: Check out the exact diagnostic revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify protected environment boundary
        run: node scripts/github-environment-guard.mjs priceflag-ml-production main optional
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Identify the deployment currently serving the production domain
        run: |
          set -euo pipefail
          npx --yes vercel@54.14.0 inspect priceflag-app.vercel.app --format=json \
            --token="$VERCEL_TOKEN" --scope=team_AqaBD6YaOf9DIJ7NzbytTZTW > /tmp/deployment.json
          node - <<'NODE'
          const deployment = require('/tmp/deployment.json');
          const project = deployment.projectId ?? deployment.project?.id ?? deployment.project?.name ?? 'unknown';
          const id = deployment.id ?? deployment.uid ?? 'unknown';
          const target = deployment.target ?? deployment.readyState ?? 'unknown';
          console.log(`Production domain deployment: project ${project}, id ${id}, target ${target}`);
          require('node:fs').writeFileSync('/tmp/deployment-id', id);
          NODE
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Compare the serving deployment against the dispatched revision
        # `vercel env pull --id=<deployment>` only works while a deployment is
        # INITIALIZING, so a per-deployment variable listing is not obtainable
        # here. The useful, always-answerable question is whether production is
        # serving the commit this workflow was dispatched from.
        run: |
          set -euo pipefail
          deployment_id=$(cat /tmp/deployment-id)
          test "$deployment_id" != unknown
          # `vercel inspect --format=json` omits git metadata entirely; the REST
          # API is the only read-only source for the deployment's commit. The
          # comparison is informational, so an API refusal downgrades to a
          # warning rather than failing the whole diagnosis.
          api_status=$(curl --silent --output /tmp/deployment-api.json --write-out '%{http_code}' --max-time 20 \
            "https://api.vercel.com/v13/deployments/$deployment_id?teamId=team_AqaBD6YaOf9DIJ7NzbytTZTW" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          if [ "$api_status" = 200 ]; then
            serving_sha=$(node -e 'const d = require("/tmp/deployment-api.json"); console.log(d.gitSource?.sha ?? d.meta?.githubCommitSha ?? "unknown");')
          else
            echo "::warning::Deployment lookup returned HTTP $api_status; cannot resolve the serving commit."
            serving_sha=unknown
          fi
          rm -f /tmp/deployment-api.json
          echo "Serving deployment $deployment_id is commit $serving_sha; workflow dispatched from $GITHUB_SHA"
          if [ "$serving_sha" = "$GITHUB_SHA" ]; then
            echo "Production serves the dispatched revision."
          else
            echo "::warning::Production serves $serving_sha, not the dispatched $GITHUB_SHA (a newer push may simply not have promoted yet)."
          fi
          rm -f /tmp/deployment.json /tmp/deployment-id

      - name: Verify required variables exist for the production environment
        # The project's variable VALUES are not readable off-platform:
        # `vercel env pull` writes them as empty strings, so sourcing a pulled
        # file and testing ${!name} reports every variable missing even when
        # production is demonstrably configured. Presence has to come from the
        # name listing; whether the values WORK is proved by the runtime itself
        # in the health step below (its adapter probe uses the real key).
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '%s\n' '{"projectId":"prj_RU8NlBDoR7t89BNqn5BagOpmpnmm","orgId":"team_AqaBD6YaOf9DIJ7NzbytTZTW"}' > .vercel/project.json
          npx --yes vercel@54.14.0 env ls production \
            --token="$VERCEL_TOKEN" --scope=team_AqaBD6YaOf9DIJ7NzbytTZTW > /tmp/env-ls.txt
          required=(SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY ML_INGEST_SECRET PRICEFLAG_MODE APP_ACCESS_SECRET AUTH_SESSION_SECRET SIGNIN_URL SUPABASE_PUBLISHABLE_KEY)
          for name in "${required[@]}"; do
            grep -qE "(^|[[:space:]])$name([[:space:]]|$)" /tmp/env-ls.txt \
              || { echo "::error::$name is not defined for the production environment"; exit 1; }
          done
          rm -f /tmp/env-ls.txt
          echo "All required variables are defined for the production environment."
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Confirm application health
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' --max-time 20 https://priceflag-app.vercel.app/api/health)
          # adapter.ok is the Supabase probe: the runtime queries Supabase with
          # its real service key to answer it, which is exactly the check the
          # old sourced-env REST probe tried (and failed) to do from outside.
          healthy=$(node -e 'try { const j = JSON.parse(require("node:fs").readFileSync("/tmp/health.json", "utf8")); console.log(j.ok === true && j.adapter?.ok === true && j.configured?.supabase === true ? "yes" : "no"); } catch { console.log("no"); }')
          rm -f /tmp/health.json
          echo "Priceflag health: HTTP $status, adapter reachable $healthy"
          test "$status" = 200 && test "$healthy" = yes
