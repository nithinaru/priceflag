name: ml-nightly

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC
  workflow_dispatch: {}

jobs:
  refit-and-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Full harness gates + drift check; exits 1 (red run) if any champion
      # stops beating its incumbent or any committed verdict snapshot drifts.
      #
      # With SUPABASE_* configured (B6), also refits every readable shop and
      # emits contract-row artifacts. With PRICEFLAG_APP_URL + ML_INGEST_SECRET
      # configured as well (C9), posts those rows to Lane B's
      # POST /api/ml/ingest, which holds the service role and does the writing.
      # Lane C's own database role stays read-only.
      #
      # The gate verdict above is what the post carries as `gate_passed`, so
      # this step cannot deploy a model it just failed: the run is recorded and
      # the rows are discarded (R28).
      - run: uv run python nightly.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ML_READONLY_KEY: ${{ secrets.SUPABASE_ML_READONLY_KEY }}
          PRICEFLAG_APP_URL: ${{ secrets.PRICEFLAG_APP_URL }}
          ML_INGEST_SECRET: ${{ secrets.ML_INGEST_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ml-nightly-output
          path: ml/out/
          retention-days: 30
